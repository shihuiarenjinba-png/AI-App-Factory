name: Image snapshot QA and unsigned Windows EXE
on:
  pull_request:
    branches:
      - codex/app-image-msix-preflight-candidate-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s products/offline-image-inventory-desk/tests -v
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s products/offline-image-inventory-desk/tests -v
      - run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name offline-image-inventory-desk --paths products/offline-image-inventory-desk --distpath dist --workpath build --specpath build products/offline-image-inventory-desk/main.py
      - name: Verify PE and write exact SHA receipt
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $checked=(git rev-parse HEAD).Trim()
          if ($checked -ne $env:SOURCE_SHA) { throw "Checkout SHA mismatch: $checked != $env:SOURCE_SHA" }
          $p="dist/offline-image-inventory-desk.exe"
          if (!(Test-Path $p)) { throw "EXE missing" }
          $bytes=[System.IO.File]::ReadAllBytes($p)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "PE missing MZ" }
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ stage="REVIEW_ONLY_UNSIGNED_EXE"; source_sha=$env:SOURCE_SHA; sha256=$sha; bytes=$bytes.Length; market_fit="MARKET_FIT_HOLD"; registration_type="MSIX_OR_PWA_APP"; identity_status="NOT_BOUND" } | ConvertTo-Json | Set-Content "dist/exe-receipt.json"
          Write-Output "EXE SHA256 $sha"
      - name: Cloud Windows GUI smoke (source interactions + packaged EXE launch)
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m pip install --disable-pip-version-check "pillow==11.3.0" "pywinauto==0.6.9"
          python products/offline-image-inventory-desk/tests/gui_smoke_windows.py --exe dist/offline-image-inventory-desk.exe --out gui-smoke-evidence --source-sha $env:SOURCE_SHA
      - name: Cloud Windows PACKAGED EXE E2E (external UI, not source Tk)
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m pip install --disable-pip-version-check "pyautogui==0.9.54" "psutil==6.1.1"
          python products/offline-image-inventory-desk/tests/gui_smoke_windows.py --mode packaged --exe dist/offline-image-inventory-desk.exe --out packaged-exe-e2e-evidence --calibration gui-smoke-evidence/ui-layout.json --source-sha $env:SOURCE_SHA
      - name: Build synthetic five-person buyer test kit from exact packaged EXE
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python products/offline-image-inventory-desk/buyer_validation_evidence.py prepare --out buyer-validation-kit --exe dist/offline-image-inventory-desk.exe --source-sha $env:SOURCE_SHA
          Copy-Item products/offline-image-inventory-desk/buyer_validation_evidence.py buyer-validation-kit/buyer_validation_evidence.py
          Copy-Item products/offline-image-inventory-desk/buyer_validation_audit.py buyer-validation-kit/buyer_validation_audit.py
          Copy-Item packaged-exe-e2e-evidence -Destination buyer-validation-kit/cloud-packaged-exe-e2e -Recurse
          python products/offline-image-inventory-desk/buyer_validation_evidence.py verify --out buyer-validation-kit
          $receipt = Get-Content buyer-validation-kit/manifest.json -Raw | ConvertFrom-Json
          $actual = (Get-FileHash buyer-validation-kit/offline-image-inventory-desk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.exe_sha256 -ne $actual) { throw "BUYER_KIT_EXE_SHA_MISMATCH" }
          if ($receipt.source_sha -ne $env:SOURCE_SHA) { throw "BUYER_KIT_SOURCE_SHA_MISMATCH" }
          if ($receipt.human_response_count -ne 0 -or $receipt.why_pay_verified) { throw "FABRICATED_BUYER_EVIDENCE" }
      - name: Upload synthetic buyer test kit (NO human responses; NOT local QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-snapshot-SYNTHETIC-BUYER-TEST-KIT-NO-REAL-RESPONSES
          path: buyer-validation-kit/
          if-no-files-found: warn
          retention-days: 5
      - name: Upload CLOUD_WINDOWS_PACKAGED_EXE_E2E evidence (not local GUI QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-snapshot-CLOUD_WINDOWS_PACKAGED_EXE_E2E-NOT-LOCAL-QA
          path: packaged-exe-e2e-evidence/
          if-no-files-found: warn
          retention-days: 5
      - name: Upload CLOUD_WINDOWS_GUI_SMOKE evidence (not local GUI QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-snapshot-CLOUD_WINDOWS_GUI_SMOKE-NOT-LOCAL-QA
          path: gui-smoke-evidence/
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@v4
        with:
          name: image-snapshot-unsigned-review-exe-NOT-MSIX
          path: dist/
          if-no-files-found: error
          retention-days: 5

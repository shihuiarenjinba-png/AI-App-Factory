name: Factory autonomous 15 minute cycle
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

concurrency:
  group: factory-app
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: codex/factory-autonomous-20261026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check activation and unfinished Draft PR
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_ENABLED: ${{ vars.FACTORY_ENABLED }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_CYCLES_PER_DAY: ${{ vars.MAX_CYCLES_PER_DAY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$FACTORY_ENABLED" != "true" ]; then echo "HOLD: set FACTORY_ENABLED=true"; exit 0; fi
          if [ -z "$OPENAI_KEY" ]; then echo "HOLD: OPENAI_API_KEY not configured"; exit 0; fi
          limit="$MAX_CYCLES_PER_DAY"
          if [ -z "$limit" ]; then limit=16; fi
          if ! [[ "$limit" =~ ^[0-9]+$ ]] || [ "$limit" -lt 1 ] || [ "$limit" -gt 48 ]; then
            echo "HOLD: MAX_CYCLES_PER_DAY must be 1..48" >&2
            exit 1
          fi
          cycles=$(git log --since="24 hours ago" --format=%s --grep='^factory: advance ' | wc -l | tr -d ' ')
          if [ "$cycles" -ge "$limit" ]; then echo "HOLD: successful cycle budget reached"; exit 0; fi
          failures=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/factory-cycle.yml/runs?per_page=100"             --jq '[.workflow_runs[] | select(.created_at >= (now - 86400 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | select(.conclusion == "failure")] | length')
          if [ "$failures" -ge 3 ]; then echo "HOLD: 3 failed runs in 24h; circuit breaker"; exit 0; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Collect market signals
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime
          echo '{"signals":[]}' > .runtime/market.json
          if [ "$(python -c 'import json;print(json.load(open("factory/state.json"))["stage"])')" = "research" ]; then
            python factory.py market
          fi
      - name: Prepare plan and scoped prompt
        if: steps.gate.outputs.ready == 'true'
        run: python factory.py plan
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: trusted-plan
          path: .runtime/
          include-hidden-files: true
          retention-days: 7
      - name: Develop one bounded change with Codex
        if: steps.gate.outputs.ready == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .runtime/PROMPT.md
      - name: Detect unauthorized tracked changes
        if: steps.gate.outputs.ready == 'true'
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: candidate
          path: .candidate/
          include-hidden-files: true
          retention-days: 7

  audit:
    needs: generate
    if: needs.generate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: trusted-plan
          path: .runtime
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: .candidate
      - name: Validate in clean runner
        run: python factory.py validate
      - name: Execute time-bounded headless tests
        shell: bash
        run: |
          set -euo pipefail
          stage=$(python -c 'import json;print(json.load(open(".runtime/plan.json"))["stage"])')
          if [ "$stage" != "research" ]; then
            timeout 100s docker run --rm --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 64 --memory 512m --cpus 1 \
              --user 65534:65534 -e PYTHONDONTWRITEBYTECODE=1 \
              -v "$PWD/.candidate/product:/work:ro" \
              -v "$PWD/scripts/sandbox_test.py:/test_runner.py:ro" -w /work \
              python:3.12-slim python /test_runner.py
          fi

  advance:
    needs: [generate, audit]
    if: needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: trusted-plan
          path: .runtime
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: .candidate
      - name: Advance isolated development branch
        env:
          EXPECTED_SHA: ${{ needs.generate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/factory-autonomous-20261026
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_SHA" ]; then
            echo "HOLD: branch changed during audit" >&2
            exit 1
          fi
          python factory.py validate
          stage=$(python -c 'import json;print(json.load(open(".runtime/plan.json"))["stage"])')
          python factory.py promote
          git switch -c "factory-run-$GITHUB_RUN_ID"
          git add -- factory/state.json
          if [ "$stage" = "research" ]; then
            git add -- proposals/
          else
            git add -- products/
            if [ -d handoffs ]; then git add -- handoffs/; fi
          fi
          if git diff --cached --quiet; then echo "HOLD: no changes"; exit 1; fi
          if git diff --cached --name-only | grep -Ev '^(factory/state.json|products/|proposals/|handoffs/)' ; then
            echo "HOLD: unexpected staged changes" >&2
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "factory: advance $stage run $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/codex/factory-autonomous-20261026"

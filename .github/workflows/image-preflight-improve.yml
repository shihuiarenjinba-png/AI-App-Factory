name: Image preflight Factory improvement and Windows EXE
on:
  push:
    branches:
      - codex/app-image-msix-preflight-candidate-20261031
    paths:
      - .github/workflows/image-preflight-improve.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: image-preflight-improve-${{ github.ref }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/codex/app-image-msix-preflight-candidate-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      request_id: ${{ steps.promote.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate and promote using owner Factory lifecycle
        id: promote
        run: python scripts/promote_image_preflight.py
  windows-exe:
    needs: promote
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable source and product tests
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.promote.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          python -m unittest discover -s products/offline-image-inventory-desk/tests -v
      - name: Install pinned Windows EXE builder
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build unsigned source/request-bound Windows EXE
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.promote.outputs.source_sha }}
          REQUEST_ID: ${{ needs.promote.outputs.request_id }}
        run: |
          python tools/build_windows_exe.py --slug offline-image-inventory-desk --expected-sha "$env:SOURCE_SHA" --source-branch codex/app-image-msix-preflight-candidate-20261031 --request-id "$env:REQUEST_ID" --output dist/preidentity
      - name: Verify EXE bytes and immutable receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.promote.outputs.source_sha }}
          REQUEST_ID: ${{ needs.promote.outputs.request_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path("dist/preidentity")
          receipt=json.loads((folder/"exe-receipt.json").read_text(encoding="utf-8"))
          exe=folder/"offline-image-inventory-desk.exe"
          assert exe.is_file()
          assert exe.open("rb").read(2)==b"MZ"
          assert hashlib.sha256(exe.read_bytes()).hexdigest()==receipt["executable_sha256"]
          assert receipt["source_sha"]==os.environ["SOURCE_SHA"]
          assert receipt["request_id"]==os.environ["REQUEST_ID"]
          assert receipt["slug"]=="offline-image-inventory-desk"
          assert receipt["store_id"] is None
          handoff={"schema_version":1,"slug":"offline-image-inventory-desk",
            "product":"Offline Image Inventory Desk",
            "repo":"shihuiarenjinba-png/AI-App-Factory",
            "source_branch":"codex/app-image-msix-preflight-candidate-20261031",
            "source_sha":receipt["source_sha"],"request_id":receipt["request_id"],
            "product_type":"APP","packaging_family":"MSIX",
            "partner_center_registration_type":"MSIX_OR_PWA_APP",
            "partner_center_selection":"MSIX or PWA app",
            "suggested_display_name":"Offline Image Inventory Desk",
            "partner_center_display_name":None,
            "reserved_display_name_verified":False,
            "identity_status":"WAITING_USER_IDENTITY",
            "identity_return_target":{"owner":"36_MIN_WINDOWS_E2E",
              "source_sha":receipt["source_sha"],"request_id":receipt["request_id"]},
            "required_fields":["store_id","reserved_display_name","identity_name",
              "publisher","publisher_display_name","pfn","package_sid"],
            "pre_identity_exe":{"status":"EXE_QA_UNSIGNED",
              "sha256":receipt["executable_sha256"],"bytes":receipt["executable_bytes"]},
            "market_fit":"MARKET_FIT_HOLD","market_score":64,
            "commercial_msix_allowed":False,
            "windows_gui_status":"UNVERIFIED","post_identity":"HOLD",
            "store_submission_allowed":False}
          (folder/"registration-handoff.json").write_text(
            json.dumps(handoff,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(handoff))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-preflight-qa-exe-NOT-MSIX
          path: dist/preidentity/
          if-no-files-found: error
          retention-days: 5

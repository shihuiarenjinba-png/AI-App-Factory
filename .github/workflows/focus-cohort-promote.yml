# Retry after verified Git ignored-path staging fix.
# Focus product promotion: controller-only, Draft-branch-only, no Store actions.
name: Focus cohort real product promotion and request-bound Windows EXE
on:
  push:
    branches:
      - codex/app-cohort-focus-controller-20261028
    paths:
      - .github/workflows/focus-cohort-promote.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focus-cohort-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/codex/app-cohort-focus-controller-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      request_id: ${{ steps.promote.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute real research and build controller promotions
        id: promote
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/promote_focus_cohort.py

  windows-exe:
    needs: promote
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact promoted source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.promote.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = "codex/app-cohort-focus-controller-20261028"
          test -f products/focus-session-desk/main.py
          test -f proposals/focus-session-desk.json
      - name: Run full Factory regression and 18 Focus functional tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s products/focus-session-desk/tests -v
      - name: Install pinned Windows EXE builder
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build request-bound unsigned Windows EXE
        env:
          SOURCE_SHA: ${{ needs.promote.outputs.source_sha }}
          REQUEST_ID: ${{ needs.promote.outputs.request_id }}
        shell: pwsh
        run: |
          python tools/build_windows_exe.py --slug focus-session-desk --expected-sha "$env:SOURCE_SHA" --source-branch codex/app-cohort-focus-controller-20261028 --request-id "$env:REQUEST_ID" --output dist/preidentity
      - name: Verify receipt and export registration handoff
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.promote.outputs.source_sha }}
          REQUEST_ID: ${{ needs.promote.outputs.request_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path("dist/preidentity")
          receipt = json.loads((out / "exe-receipt.json").read_text(encoding="utf-8"))
          exe = out / "focus-session-desk.exe"
          assert exe.is_file() and exe.read_bytes()[:2] == b"MZ"
          assert hashlib.sha256(exe.read_bytes()).hexdigest() == receipt["executable_sha256"]
          assert receipt["source_sha"] == os.environ["SOURCE_SHA"]
          assert receipt["request_id"] == os.environ["REQUEST_ID"]
          assert receipt["slug"] == "focus-session-desk"
          assert receipt["store_id"] is None
          handoff = {
              "schema_version": 1,
              "product": "Focus Session Desk — Offline Timer and Task Checklist",
              "slug": "focus-session-desk",
              "repo": "shihuiarenjinba-png/AI-App-Factory",
              "source_branch": "codex/app-cohort-focus-controller-20261028",
              "source_sha": receipt["source_sha"],
              "request_id": receipt["request_id"],
              "product_type": "APP",
              "packaging_family": "MSIX",
              "partner_center_registration_type": "MSIX_OR_PWA_APP",
              "partner_center_selection": "MSIX or PWA app",
              "partner_center_display_name": "Focus Session Desk",
              "identity_status": "WAITING_USER_IDENTITY",
              "required_fields": ["Store ID", "reserved display name", "Package Identity Name",
                                  "Publisher", "Publisher Display Name", "PFN", "Package SID"],
              "identity_return_target": {"owner": "36_MIN_WINDOWS_E2E",
                                         "stage": "AUTHENTICATED_IDENTITY_EVIDENCE_AND_CAS"},
              "pre_identity_exe": {"status": "EXE_QA_UNSIGNED",
                                   "sha256": receipt["executable_sha256"],
                                   "bytes": receipt["executable_bytes"]},
              "windows_gui_status": "UNVERIFIED",
              "msix_status": "NOT_BUILT",
              "identity_cas_allowed": False
          }
          (out / "registration-handoff.json").write_text(
              json.dumps(handoff, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(handoff, ensure_ascii=False))
          PY
      - name: Publish correlated Focus Windows EXE and registration artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-session-desk-preidentity-${{ needs.promote.outputs.source_sha }}
          path: dist/preidentity/
          if-no-files-found: error
          retention-days: 5

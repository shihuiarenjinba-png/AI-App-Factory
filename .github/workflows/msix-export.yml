name: Factory MSIX export
on:
  push:
    branches:
      # Approved Identity can be returned to any isolated codex work branch.
      # Never build on main/release directly; the package gate still requires
      # products/<slug>/store/approved-identity.json.
      - "codex/**"
    paths:
      - "products/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Existing product slug; approved Identity and PNG assets required"
        required: true
        type: string
      exe_artifact_run_id:
        description: "Successful Factory pre-Identity Windows EXE run ID for the pinned source SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: factory-msix-export-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject manual dispatch outside isolated work branches
        run: python tools/msix_export_ref_guard.py
      - name: Select exactly one product from the complete push range
        id: pick
        env:
          EXPLICIT_SLUG: ${{ inputs.slug }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python tools/msix_push_product.py
      - name: Run factory regression tests
        if: steps.pick.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests -v
      - name: Explain push HOLD until immutable EXE Artifact run is selected
        if: steps.pick.outputs.ready == 'true' && github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: 'echo "HOLD: manually dispatch with the successful pre-Identity EXE Artifact run ID; no EXE rebuild" >> $env:GITHUB_STEP_SUMMARY'
      - name: Download and verify the pinned pre-Identity Windows EXE Artifact
        if: steps.pick.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXE_RUN_ID: ${{ inputs.exe_artifact_run_id }}
        shell: pwsh
        run: python tools/prebuilt_msix.py --slug "${{ steps.pick.outputs.slug }}" --run-id "$env:EXE_RUN_ID" --output dist/prebuilt
      - name: Build MSIX on Windows with approved package identity
        if: steps.pick.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        run: python tools/build_windows_msix.py --slug "${{ steps.pick.outputs.slug }}" --prebuilt-dir dist/prebuilt --output dist/msix
      - name: Assemble verified MSIX handoff
        if: steps.pick.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        run: python tools/msix_handoff.py --slug "${{ steps.pick.outputs.slug }}" --msix "dist/msix/${{ steps.pick.outputs.slug }}.msix" --output dist/handoff
      - name: Export package and checksum for Windows-all-auto
        if: steps.pick.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: factory-msix-handoff-${{ steps.pick.outputs.slug }}
          path: dist/handoff/factory-msix-handoff/
          if-no-files-found: error
          retention-days: 5

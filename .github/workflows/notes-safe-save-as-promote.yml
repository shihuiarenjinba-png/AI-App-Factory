name: Offline Notes safe Save As owner promote and Windows evidence
on:
  push:
    branches:
      - codex/app-notes-safe-save-as-20261030
    paths:
      - scripts/notes_safe_save_as_promote.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-safe-save-as-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner-promote:
    if: github.ref == 'refs/heads/codex/app-notes-safe-save-as-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      request_id: ${{ steps.promote.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authorized owner candidate validation and guarded promote
        id: promote
        run: python scripts/notes_safe_save_as_promote.py

  windows-exe:
    needs: owner-promote
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.owner-promote.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable source and Factory state
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.owner-promote.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e .candidate/product
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("factory/state.json").read_text(encoding="utf-8"))
          assert s == {"schema": 1, "kind": "app", "stage": "research", "cycle": 6, "revision": 0, "slug": None}
          PY
      - name: Factory and product tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s products/offline-notes-canary/tests -p "test*.py" -v
      - name: Install pinned Windows EXE builder
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build real unsigned EXE with source and request
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.owner-promote.outputs.source_sha }}
          REQUEST_ID: ${{ needs.owner-promote.outputs.request_id }}
        run: |
          python tools/build_windows_exe.py --slug offline-notes-canary --expected-sha "$env:SOURCE_SHA" --source-branch codex/app-notes-safe-save-as-20261030 --request-id "$env:REQUEST_ID" --output dist/preidentity
      - name: Verify EXE and create guarded registration handoff
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.owner-promote.outputs.source_sha }}
          REQUEST_ID: ${{ needs.owner-promote.outputs.request_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path("dist/preidentity")
          r=json.loads((p/"exe-receipt.json").read_text(encoding="utf-8"))
          raw=(p/"offline-notes-canary.exe").read_bytes()
          assert raw[:2]==b"MZ"
          assert hashlib.sha256(raw).hexdigest()==r["executable_sha256"]
          assert len(raw)==r["executable_bytes"]
          assert r["source_sha"]==os.environ["SOURCE_SHA"]
          assert r["request_id"]==os.environ["REQUEST_ID"]
          assert r["store_id"] is None
          job={
            "schema_version":1, "product":"Offline Notes Canary",
            "slug":"offline-notes-canary", "repo":"shihuiarenjinba-png/AI-App-Factory",
            "source_branch":"codex/app-notes-safe-save-as-20261030",
            "source_sha":r["source_sha"],"request_id":r["request_id"],
            "product_type":"APP","packaging_family":"MSIX",
            "partner_center_registration_type":"MSIX_OR_PWA_APP",
            "partner_center_selection":"MSIX or PWA app",
            "proposed_display_name":"Offline Notes Canary",
            "partner_center_display_name":None,
            "reserved_display_name_verified":False,
            "identity_status":"REFERENCE_AVAILABLE",
            "user_provided_store_id_reference":"9MZ8ZZTRTS17",
            "identity_binding_status":"NOT_BOUND",
            "required_fields":["store_id","reserved_display_name","identity_name","publisher","publisher_display_name","pfn","package_sid"],
            "identity_return_target":{"owner":"36_MIN_WINDOWS_E2E","stage":"AUTHENTICATED_IDENTITY_EVIDENCE_AND_CAS","source_sha":r["source_sha"],"request_id":r["request_id"]},
            "pre_identity_exe":{"status":"EXE_QA_UNSIGNED","sha256":r["executable_sha256"],"bytes":r["executable_bytes"]},
            "windows_gui_status":"PENDING_SEPARATE_QA",
            "commercial_quality_status":"HOLD","msix_status":"NOT_BUILT","identity_cas_allowed":False
          }
          (p/"registration-handoff.json").write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload source-bound unsigned EXE and job
        uses: actions/upload-artifact@v4
        with:
          name: offline-notes-safe-save-as-${{ needs.owner-promote.outputs.source_sha }}
          path: dist/preidentity/
          if-no-files-found: error
          retention-days: 5

  real-windows-gui:
    needs: owner-promote
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.owner-promote.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot QA dependency
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Real 1024x768 Tk GUI with bilingual Save As and restart
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.owner-promote.outputs.source_sha }}
          GUI_QA_OUTPUT: dist/notes-gui-qa
        run: |
          python -m unittest discover -s products/offline-notes-canary/tests -p "test*.py" -v
          python tools/notes_windows_gui_qa.py
      - name: Upload screenshot and GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-notes-safe-save-as-gui
          path: dist/notes-gui-qa/
          if-no-files-found: warn
          retention-days: 3

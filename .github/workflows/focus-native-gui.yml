name: Focus native Windows EXE GUI evidence

on:
  pull_request:
    paths:
      - 'products/focus-session-desk/main.py'
      - 'products/focus-session-desk/tests/windows_exe_gui_smoke.py'
      - '.github/workflows/focus-native-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focus-native-gui:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout raw PR source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Source SHA mismatch: $actual" }
          Write-Output "exact_source_sha=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows GUI and EXE build tools
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 pywinauto==0.6.9
      - name: Build real Windows native EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FocusSessionDesk --distpath dist --workpath build/focus-gui --specpath build/focus-gui products/focus-session-desk/main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (-not (Test-Path dist/FocusSessionDesk.exe)) { throw "Missing native EXE" }
      - name: Run native GUI smoke and capture screenshots/receipt
        shell: pwsh
        timeout-minutes: 8
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "focus-native-gui-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          python products/focus-session-desk/tests/windows_exe_gui_smoke.py dist/FocusSessionDesk.exe focus-gui-evidence
          if ($LASTEXITCODE -ne 0) { throw "Native GUI smoke failed" }
      - name: Save source, EXE and receipt SHA evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path focus-gui-evidence | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 focus-gui-evidence/source-sha.txt
          if (Test-Path dist/FocusSessionDesk.exe) {
            (Get-FileHash dist/FocusSessionDesk.exe -Algorithm SHA256).Hash | Out-File -Encoding utf8 focus-gui-evidence/exe-sha256.txt
          }
      - name: Upload native GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-native-gui-${{ github.run_id }}
          path: focus-gui-evidence/
          if-no-files-found: error
          retention-days: 30

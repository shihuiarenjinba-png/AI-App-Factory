name: APP exact-source strict Provisioner handoff proof

on:
  pull_request:
    paths:
      - "tools/build_windows_exe.py"
      - "tests/test_build_windows_exe.py"
      - ".github/workflows/app-strict-preidentity-contract.yml"

permissions:
  contents: read

concurrency:
  group: app-strict-job-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  windows-exe-and-strict-job:
    if: startsWith(github.head_ref, 'codex/')
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Factory regression and strict-job contract tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned unsigned Windows EXE builder
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Verify remote source then build real EXE and dry-run Provisioner job
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $remoteLine = git ls-remote origin "refs/heads/$env:SOURCE_BRANCH"
          if ($LASTEXITCODE -ne 0 -or -not $remoteLine) { throw "Source branch missing" }
          $remoteSha = ($remoteLine | Select-Object -First 1).Split("`t")[0]
          if ($sha -ne $remoteSha) { throw "Remote HEAD changed; refuse stale build" }
          $request = "app-focus-strict-" + $sha.Substring(0, 12)
          python tools/build_windows_exe.py --slug focus-session-desk --expected-sha "$sha" --source-branch "$env:SOURCE_BRANCH" --request-id "$request" --output dist/preidentity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUILD_SOURCE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_REQUEST_ID=$request" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify real EXE bytes, exact receipt, and strict job
        shell: pwsh
        run: |
          @'
          import hashlib, json, os
          from pathlib import Path
          from tools.build_windows_exe import strict_provisioner_job
          folder = Path("dist/preidentity")
          exe = folder / "focus-session-desk.exe"
          receipt = json.loads((folder / "exe-receipt.json").read_text(encoding="utf-8"))
          job = json.loads(Path("dist/preidentity-provisioner-job.json").read_text(encoding="utf-8"))
          assert {p.name for p in folder.iterdir()} == {"focus-session-desk.exe", "exe-receipt.json"}
          assert exe.read_bytes()[:2] == b"MZ"
          assert hashlib.sha256(exe.read_bytes()).hexdigest() == receipt["executable_sha256"]
          assert exe.stat().st_size == receipt["executable_bytes"]
          assert receipt["source_sha"] == os.environ["BUILD_SOURCE_SHA"]
          assert receipt["request_id"] == os.environ["BUILD_REQUEST_ID"]
          assert job == strict_provisioner_job(receipt)
          assert job["dry_run"] is True and job["requested_actions"] == ["BUILD_WINDOWS"]
          assert receipt["store_id"] is None and receipt["msix_status"] == "NOT_BUILT"
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve exact-source EXE and separate Provisioner job
        uses: actions/upload-artifact@v4
        with:
          name: app-strict-job-${{ github.event.pull_request.head.sha }}
          path: |
            dist/preidentity/
            dist/preidentity-provisioner-job.json
          if-no-files-found: error
          retention-days: 5

name: Factory pre-Identity Windows EXE

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "products/**/main.py"
      - "products/**/manifest.json"
      - "products/**/tests/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Existing committed APP slug; official Store Identity not required"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: factory-preidentity-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse main/release or unapproved workflow dispatch
        run: python tools/msix_export_ref_guard.py
      - name: Select one APP product from the complete push range
        id: pick
        env:
          EXPLICIT_SLUG: ${{ inputs.slug }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: python tools/preidentity_product_select.py
      - name: Verify source contracts
        if: steps.pick.outputs.ready == 'true'
        run: python -m unittest discover -s tests -v
      - name: Install Windows EXE builder (no paid AI)
        if: steps.pick.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build actual Windows EXE and SHA receipt without Store Identity
        if: steps.pick.outputs.ready == 'true'
        run: python tools/build_windows_exe.py --slug "${{ steps.pick.outputs.slug }}" --expected-sha "${{ github.sha }}" --request-id "app-${{ steps.pick.outputs.slug }}-${{ github.sha }}" --output dist/preidentity
      - name: Publish pre-Identity EXE QA evidence (not an MSIX)
        if: steps.pick.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: factory-preidentity-exe-${{ steps.pick.outputs.slug }}-${{ github.sha }}
          path: dist/preidentity/
          if-no-files-found: error
          retention-days: 5

name: File Integrity native Windows EXE GUI evidence

on:
  pull_request:
    paths:
      - 'products/file-integrity-ledger/main.py'
      - 'products/file-integrity-ledger/tests/windows_exe_gui_smoke.py'
      - '.github/workflows/integrity-native-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-native-gui:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout raw source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Source SHA mismatch: $actual" }
          Write-Output "exact_source_sha=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Windows EXE and GUI tools
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 pywinauto==0.6.9 pillow==11.3.0
      - name: Build real Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FileIntegrityLedger --distpath dist --workpath build/integrity-gui --specpath build/integrity-gui products/file-integrity-ledger/main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (-not (Test-Path dist/FileIntegrityLedger.exe)) { throw "Missing EXE" }
      - name: Native first-use GUI smoke and receipt
        shell: pwsh
        timeout-minutes: 8
        run: |
          python products/file-integrity-ledger/tests/windows_exe_gui_smoke.py dist/FileIntegrityLedger.exe integrity-gui-evidence
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke failed" }
      - name: Capture source EXE and PNG SHA256
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path integrity-gui-evidence | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 integrity-gui-evidence/source-sha.txt
          if (Test-Path dist/FileIntegrityLedger.exe) {
            (Get-FileHash dist/FileIntegrityLedger.exe -Algorithm SHA256).Hash | Out-File -Encoding utf8 integrity-gui-evidence/exe-sha256.txt
          }
          $assets = 'StoreLogo.png','Square150.png','Square44.png'
          foreach ($asset in $assets) {
            $path = Join-Path 'products/file-integrity-ledger/store/assets' $asset
            if (-not (Test-Path $path)) { throw "Missing package asset: $path" }
            $sha = (Get-FileHash $path -Algorithm SHA256).Hash
            "$asset $sha" | Out-File -Append -Encoding utf8 integrity-gui-evidence/png-sha256.txt
          }
      - name: Upload GUI and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-native-gui-${{ github.run_id }}
          path: integrity-gui-evidence/
          if-no-files-found: error
          retention-days: 30

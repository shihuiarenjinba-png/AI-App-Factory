name: Image Inventory preserve snapshot rows and rebuild EXE
on:
  push:
    branches:
      - codex/app-image-inventory-append-safety-20261029
    paths:
      - .github/workflows/image-inventory-append-safety.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-inventory-append-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  improve:
    if: github.ref == 'refs/heads/codex/app-image-inventory-append-safety-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.improve.outputs.source_sha }}
      request_id: ${{ steps.improve.outputs.request_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Owner-controlled improve plan, 26 tests, validate and promote
        id: improve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/improve_image_inventory_append_safety.py

  windows-exe:
    needs: improve
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact promoted source and immutable request
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.improve.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git branch --show-current)" = "codex/app-image-inventory-append-safety-20261029"
          test -f products/offline-image-inventory-desk/main.py
          test -f proposals/offline-image-inventory-desk.json
          test -z "$(git status --porcelain)"
      - name: Factory and image inventory Windows regression
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s products/offline-image-inventory-desk/tests -v
      - name: Install pinned EXE builder
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build unsigned request-bound Windows EXE
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.improve.outputs.source_sha }}
          REQUEST_ID: ${{ needs.improve.outputs.request_id }}
        run: |
          python tools/build_windows_exe.py --slug offline-image-inventory-desk --expected-sha "$env:SOURCE_SHA" --source-branch codex/app-image-inventory-append-safety-20261029 --request-id "$env:REQUEST_ID" --output dist/preidentity
      - name: Verify EXE and emit safe Partner Center handoff
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.improve.outputs.source_sha }}
          REQUEST_ID: ${{ needs.improve.outputs.request_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path("dist/preidentity")
          receipt = json.loads((folder / "exe-receipt.json").read_text(encoding="utf-8"))
          exe = folder / "offline-image-inventory-desk.exe"
          assert exe.is_file() and exe.read_bytes()[:2] == b"MZ"
          assert hashlib.sha256(exe.read_bytes()).hexdigest() == receipt["executable_sha256"]
          assert receipt["source_sha"] == os.environ["SOURCE_SHA"]
          assert receipt["request_id"] == os.environ["REQUEST_ID"]
          assert receipt["slug"] == "offline-image-inventory-desk"
          assert receipt["store_id"] is None
          handoff = {
              "schema_version": 1,
              "product": "Offline Image Inventory Desk",
              "slug": "offline-image-inventory-desk",
              "repo": "shihuiarenjinba-png/AI-App-Factory",
              "source_branch": "codex/app-image-inventory-append-safety-20261029",
              "source_sha": receipt["source_sha"],
              "request_id": receipt["request_id"],
              "product_type": "APP",
              "packaging_family": "MSIX",
              "partner_center_registration_type": "MSIX_OR_PWA_APP",
              "partner_center_selection": "MSIX or PWA app",
              "partner_center_display_name": None,
              "suggested_display_name": "Offline Image Inventory Desk",
              "reserved_display_name_verified": False,
              "identity_status": "WAITING_USER_IDENTITY",
              "required_fields": ["store_id", "reserved_display_name", "identity_name",
                                  "publisher", "publisher_display_name", "pfn", "package_sid"],
              "identity_return_target": {
                  "owner": "36_MIN_WINDOWS_E2E",
                  "stage": "AUTHENTICATED_IDENTITY_EVIDENCE_AND_CAS",
                  "source_sha": receipt["source_sha"],
                  "request_id": receipt["request_id"]
              },
              "pre_identity_exe": {
                  "status": "EXE_QA_UNSIGNED",
                  "sha256": receipt["executable_sha256"],
                  "bytes": receipt["executable_bytes"]
              },
              "windows_gui_status": "UNVERIFIED",
              "msix_status": "NOT_BUILT",
              "identity_cas_allowed": False
          }
          (folder / "registration-handoff.json").write_text(
              json.dumps(handoff, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(handoff, ensure_ascii=False))
          PY
      - name: Upload exact-source EXE and handoff
        uses: actions/upload-artifact@v4
        with:
          name: offline-image-inventory-append-safety-${{ needs.improve.outputs.source_sha }}
          path: dist/preidentity/
          if-no-files-found: error
          retention-days: 5

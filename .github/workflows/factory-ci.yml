name: Factory core CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile factory.py scripts/simulate_clock.py
      - name: Simulate 96 quarter-hour ticks (not real scheduled dispatch)
        run: python scripts/simulate_clock.py
      - name: Exercise hardened isolated runner (no model API key)
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --memory 512m --cpus 1 --user 65534:65534 \
            python:3.12-slim python -c "print('sandbox-smoke: ok')"
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test APP source and Windows EXE build contracts
        run: python -m unittest discover -s tests -v
      - name: Run candidate-specific Windows functional tests when present
        shell: pwsh
        run: |
          if (Test-Path .candidate/product/tests/test_smoke.py) {
            python -m unittest discover -s .candidate/product/tests -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile Windows pre-Identity builder
        run: python -m py_compile tools/build_windows_exe.py tools/preidentity_product_select.py
  windows-exe-smoke:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/app-preidentity-')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PyInstaller without AI APIs
        run: python -m pip install --disable-pip-version-check "pyinstaller==6.16.0"
      - name: Build real Windows GUI PE from isolated committed QA fixture
        run: python -m tools.windows_exe_build_smoke --output dist/qa-exe
      - name: Export QA-only PE and SHA receipt (not a Store product)
        uses: actions/upload-artifact@v4
        with:
          name: app-preidentity-real-pe-smoke-NOT_PRODUCT
          path: dist/qa-exe/
          if-no-files-found: error
          retention-days: 3
